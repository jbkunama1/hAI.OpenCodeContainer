version: "3.8"

services:
  opencode-with-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: jbkunama1/hai.opencodecontainer:mcp
    container_name: opencode-mcp
    restart: unless-stopped
    ports:
      - "8076:8076"   # OpenCode Web UI
      - "9000:9000"   # MCP Server
      - "9001:9001"   # Health Check
    environment:
      - TZ=Europe/Berlin
      - OPENCODE_SERVER_USERNAME=opencode
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOCAL_ENDPOINT=${LOCAL_ENDPOINT:-http://localhost:8000/v1}
      - CUSTOM_OPENAI_ENDPOINT=${CUSTOM_OPENAI_ENDPOINT:-http://localhost:8000/v1}
      - CUSTOM_MCP_ENDPOINT=${CUSTOM_MCP_ENDPOINT:-http://localhost:9000}
      - OPENCODE_MCP_SECRET_KEY=${OPENCODE_MCP_SECRET_KEY}
      - MCP_PORT=9000
      - LOG_LEVEL=INFO
    volumes:
      - opencode_data:/root/.local/share/opencode
      - opencode_projects:/workspace
    working_dir: /workspace
    networks:
      - highfishNetwork

networks:
  highfishNetwork:
    external: true

volumes:
  opencode_data:
  opencode_projects: