version: "3.8"

services:
  opencode:
    image: ghcr.io/jbkunama1/hai.opencodecontainer:latest
    container_name: opencode
    restart: unless-stopped
    command: sh -c "opencode web --port 4096 --hostname 0.0.0.0"
    ports:
      - "${OPENCODE_PORT:-4096}:4096"
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME:-opencode}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOCAL_ENDPOINT=${LOCAL_ENDPOINT}
      - OPENCODE_CONFIG_CONTENT={"$schema":"https://opencode.ai/config.json","server":{"port":4096,"hostname":"0.0.0.0"},"provider":{"openai":{"options":{"apiKey":"${OPENAI_API_KEY}","baseURL":"${LOCAL_ENDPOINT}"}}},"enabled_providers":["openai"],"snapshot":false,"autoupdate":false,"mcp":{"github":{"enabled":true,"repositories":["jbkunama1/*"]}}}
    volumes:
      - ${OPENCODE_DATA_DIR:-~/opencode/data}:/root/.local/share/opencode
      - ${OPENCODE_PROJECTS_DIR:-~/opencode/projects}:/workspace
    working_dir: /workspace
    networks:
      - highfishNetwork

networks:
  highfishNetwork:
    external: true
