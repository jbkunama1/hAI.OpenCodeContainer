name: Build and Push Docker Images

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (tag format)'
        required: true
        default: 'latest'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build OpenCode MCP Image
        run: |
          docker buildx build \
            --file Dockerfile.mcp \
            --tag ghcr.io/${{ github.repository }}:latest \
            --tag ghcr.io/${{ github.repository }}:${{ github.sha }} \
            --platform linux/amd64 \
            --push \
            .
          
          # Also tag as main version
          docker buildx build \
            --file Dockerfile.mcp \
            --tag ghcr.io/${{ github.repository }}:main \
            --platform linux/amd64 \
            --push \
            .
            
      - name: Update README with latest image
        run: |
          if ! grep -q "ghcr.io/${{ github.repository }}:latest" README.md; then
            sed -i "s|ghcr\.io/jbkunama1/hai\.opencodecontainer:latest|ghcr.io/${{ github.repository }}:latest|g" README.md
            git add README.md
            git commit -m "ci: Update image reference to ghcr.io" || true
            git push origin main || true
          fi